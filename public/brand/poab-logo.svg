<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" width="100%" height="100%">
  <!-- Left Side: Monogram Pillar Emblem (scaled) -->
  <g transform="translate(10, 5) scale(0.45)">
    <!-- Top Roof / Pediment -->
    <polygon points="100,6 182,34 182,50 100,24 18,50 18,34" fill="#D4AF37" />
    <!-- Capital Band 1 -->
    <polygon points="100,28 172,52 172,64 100,42 28,64 28,52" fill="#D4AF37" />
    <!-- Capital Band 2 -->
    <polygon points="100,46 164,68 164,78 100,58 36,78 36,68" fill="#D4AF37" />
    <!-- Left Pillar / "P" Stem -->
    <polygon points="36,84 62,84 62,176 36,176" fill="#D4AF37" />
    <!-- "P" Top Horizontal & Arch -->
    <polygon points="62,84 100,84 100,136 62,136 62,118 84,118 84,102 62,102" fill="#D4AF37" />
    <!-- Central Column Shaft -->
    <polygon points="94,84 106,84 106,176 94,176" fill="#D4AF37" />
    <!-- "G" Monogram Structure -->
    <polygon points="106,84 164,84 164,102 122,102 122,158 148,158 148,136 132,136 132,120 164,120 164,176 106,176" fill="#D4AF37" />
    <!-- Plinth Band 1 -->
    <polygon points="100,182 164,162 164,172 100,192 36,172 36,162" fill="#D4AF37" />
    <!-- Plinth Band 2 -->
    <polygon points="100,196 172,176 172,188 100,208 28,188 28,176" fill="#D4AF37" />
    <!-- Base Pedestal -->
    <polygon points="100,212 182,188 182,204 100,228 18,204 18,188" fill="#D4AF37" />
  </g>

  <!-- Right Side: Official Typography -->
  <g transform="translate(115, 20)">
    <!-- Primary Brand Name -->
    <text x="0" y="32" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="34" font-weight="700" letter-spacing="2" fill="#D4AF37">
      POAB GLOBAL
    </text>
    <!-- Corporate Subtitle -->
    <text x="0" y="55" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="2.8" fill="#FFFFFF">
      CONSTRUCTION COMPANY LTD
    </text>
    <!-- CAC Registration & Tagline -->
    <text x="0" y="74" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2" fill="#D4AF37">
      RC 9896965
    </text>
    <text x="96" y="74" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="400" letter-spacing="2.8" fill="#D4AF37" opacity="0.85">
      • BUILDING FROM FOUNDATION TO FINISH
    </text>
  </g>
</svg>
